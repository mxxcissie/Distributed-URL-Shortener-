services:
  db:
    image: postgres:15
    container_name: urlshortener-db
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: urlshortener-redis
    ports:
      - "6379:6379"

  app1:
    build: .
    container_name: urlshortener-app1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      INSTANCE_NAME: app1
    depends_on:
      - db
      - redis

  app2:
    build: .
    container_name: urlshortener-app2
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      INSTANCE_NAME: app2
    depends_on:
      - db
      - redis

  app3:
    build: .
    container_name: urlshortener-app3
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      INSTANCE_NAME: app3
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: urlshortener-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data: