services:
  db:
    image: postgres:15
    container_name: urlshortener-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: urlshortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: urlshortener-migrate
    environment:
      ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      AUTO_CREATE_SCHEMA: "false"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app1:
    build: .
    container_name: urlshortener-app1
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://127.0.0.1:8000
      AUTO_CREATE_SCHEMA: "false"
      INSTANCE_NAME: app1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  app2:
    build: .
    container_name: urlshortener-app2
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://127.0.0.1:8000
      AUTO_CREATE_SCHEMA: "false"
      INSTANCE_NAME: app2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  app3:
    build: .
    container_name: urlshortener-app3
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://127.0.0.1:8000
      AUTO_CREATE_SCHEMA: "false"
      INSTANCE_NAME: app3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: urlshortener-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started

volumes:
  postgres_data:
